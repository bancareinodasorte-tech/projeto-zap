name: RDS runtime syntax check
on:
  pull_request:
    branches: [main]
    paths:
      - 'runtime-rds-official-sales-auth-v3.mjs'
      - 'runtime-rds-tenant-sales-v1.mjs'
      - 'runtime-rds-operator-auth-v2.mjs'
      - 'runtime-rds-admin-company-management-v1.mjs'
      - 'runtime-rds-tenant-scope-v1.mjs'
      - 'MIGRATION-OWNER-OPERATIONAL-RESET-2026-10.sql'
      - 'prepare-pagbank-no-email.mjs'
      - 'ui-rds-ticket-archive-v2.js'
      - 'ui-rds-official-sales-final-v2.js'
      - 'ui-rds-official-sales-v4.js'
      - 'runtime-rds-final-rules.mjs'
      - 'runtime-rds-payment-reminders-v1.mjs'
      - 'runtime-rds-mercadopago-order-routes-v1.mjs'
      - 'runtime-rds-whatsapp-tenant-v1.mjs'
      - 'runtime-rds-official-ticket-chromium-v1.mjs'
      - 'runtime-rds-official-sales-diagnostics-v1.mjs'
      - 'runtime-rds-official-sales-final-v1.mjs'
      - 'runtime-rds-whatsapp-crm-tenant-fix-v1.mjs'
      - 'runtime-rds-whatsapp-meta-cloud-v1.mjs'
      - 'runtime-rds-whatsapp-panel-v1.mjs'
      - 'runtime-rds-official-issue-worker-v1.mjs'
      - 'server.js'
      - '.github/workflows/rds-runtime-syntax.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check official integration guard syntax
        run: node --check runtime-rds-official-sales-auth-v3.mjs
      - name: Check tenant session validation syntax
        run: node --check runtime-rds-tenant-sales-v1.mjs
      - name: Check isolated registration syntax
        run: node --check runtime-rds-operator-auth-v2.mjs
      - name: Check company management syntax
        run: node --check runtime-rds-admin-company-management-v1.mjs
      - name: Check tenant scope syntax
        run: node --check runtime-rds-tenant-scope-v1.mjs
      - name: Check tenant-aware bot rules syntax
        run: node --check runtime-rds-final-rules.mjs
      - name: Check payment reminders syntax
        run: node --check runtime-rds-payment-reminders-v1.mjs
      - name: Check official ticket PDF runtime syntax
        run: node --check runtime-rds-official-ticket-chromium-v1.mjs
      - name: Check official issue worker syntax
        run: node --check runtime-rds-official-issue-worker-v1.mjs
      - name: Check official sales settings UI syntax
        run: node --check ui-rds-official-sales-v4.js
      - name: Check official sales orders UI syntax
        run: node --check ui-rds-official-sales-final-v2.js
      - name: Check ticket archive UI syntax
        run: node --check ui-rds-ticket-archive-v2.js
      - name: Install runtime dependencies for startup-pipeline validation
        run: yarn install --ignore-scripts --non-interactive
      - name: Apply complete Render startup pipeline and validate generated server
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('prepare-validation.mjs',fs.readFileSync('prepare-pagbank-no-email.mjs','utf8').replace(\"await import('./server.js');\",''))"
          node prepare-validation.mjs
          node --check server.js
          rm -f prepare-validation.mjs
      - name: Check Mercado Pago order routes syntax
        run: node --check runtime-rds-mercadopago-order-routes-v1.mjs
      - name: Check WhatsApp tenant sender syntax
        run: node --check runtime-rds-whatsapp-tenant-v1.mjs
      - name: Check official worker syntax
        run: node --check runtime-rds-official-issue-worker-v1.mjs
      - name: Check server syntax
        run: node --check server.js
      - name: Check legacy official sales routes
        run: node --check runtime-rds-official-sales-final-v1.mjs
      - name: Check official diagnostics access
        run: node --check runtime-rds-official-sales-diagnostics-v1.mjs
      - name: Check ticket PDF access isolation
        run: node --check runtime-rds-official-ticket-chromium-v1.mjs
      - name: Check owner-only legacy WhatsApp panel
        run: node --check runtime-rds-whatsapp-panel-v1.mjs
      - name: Check owner-only Meta WhatsApp routes
        run: node --check runtime-rds-whatsapp-meta-cloud-v1.mjs
      - name: Check CRM tenant isolation
        run: node --check runtime-rds-whatsapp-crm-tenant-fix-v1.mjs

      - name: Check operational archive filter and migration
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('runtime-rds-tenant-scope-v1.mjs','utf8');const m=fs.readFileSync('MIGRATION-OWNER-OPERATIONAL-RESET-2026-10.sql','utf8');for(const t of ['rds10_orders','rds10_contacts','rds10_messages','rds10_ticket_documents','operational_archived_at=is.null'])if(!s.includes(t))throw new Error('Missing archive filter: '+t);for(const t of ['rds10_orders','rds10_contacts','rds10_messages','rds10_ticket_documents','ADD COLUMN IF NOT EXISTS operational_archived_at'])if(!m.includes(t))throw new Error('Missing migration: '+t);console.log('Operational archive guard OK')"
