name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Android project
        working-directory: android-app
        run: gradle tasks --no-daemon

      - name: Build final installable APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Verify APK structure
        run: unzip -t android-app/app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Rename final APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Canal-de-Vendas-RDS-V11.1-final.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Canal-de-Vendas-RDS-V11.1-final
          path: Canal-de-Vendas-RDS-V11.1-final.apk
          if-no-files-found: error
