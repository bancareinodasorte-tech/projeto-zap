name: rds-stage3-guided-purchase
on:
  push:
    paths:
      - '.github/workflows/rds-stage3-guided-purchase.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply stage 3
        run: |
          echo '
' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check server.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git commit -m 'bot: guided customer purchase flow' || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/rds-stage3-guided-purchase.yml
          git commit -m 'chore: remove temporary stage 3 workflow'
          git push
