name: rds-menu-step2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'bot:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch menu routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('server.js'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'function routerMessage\(settings\)\{.*?\n\s*\}', """function routerMessage(settings){
            return `🍀 *CANAL DE VENDAS RDS*\\n\\nOlá! 👋 Como posso ajudar?\\n\\n1️⃣ *Comprar bilhetes*\\n2️⃣ *Consultar meu pedido*\\n3️⃣ *Falar com atendente*\\n4️⃣ *Ver este menu novamente*\\n\\nDigite apenas o número da opção.`;
          }""", s, count=1, flags=re.S)
          marker='  let order = identity.phone ? await activeOrder(identity.phone) : null;'
          if marker not in s: raise SystemExit('ORDER_MARKER_NOT_FOUND')
          block="""
          // Menu global: a navegação vem antes de qualquer pedido ativo.
          const menuText=cleanText(text);
          if(/^(0|4|MENU|IN[IÍ]CIO|OI|OL[AÁ])$/i.test(menuText)) return replyInbound(identity,routerMessage(settings));
          if(/^1$/.test(menuText)) return beginOrder(identity,null);
          if(/^3$/.test(menuText)){
            const office=normalizeBR(settings.office_whatsapp || OFFICE_WA_DEFAULT);
            await logEvent('ENCAMINHADO_ESCRITORIO',{phone:identity.phone||null});
            return replyInbound(identity,`🏢 *ATENDIMENTO*\\nhttps://wa.me/${office}?text=${encodeURIComponent('Olá, vim pelo CANAL DE VENDAS RDS e preciso de atendimento.')}`);
          }
          if(/^2$/.test(menuText)){
            if(!order) return replyInbound(identity,'🔎 *CONSULTAR PEDIDO*\\n\\nEnvie o código do pedido (ex.: RDS-ABC123).');
            return replyInbound(identity,`🔎 *STATUS DO PEDIDO*\\n\\nPedido: *${order.code}*\\nStatus: *${order.status}*\\n${order.quantity?`Bilhetes: ${order.quantity}\\n`:''}${order.total_amount?`Total: R$ ${money(order.total_amount)}`:''}`);
          }
"""
          s=s.replace(marker,marker+block,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: node --check server.js
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git rm .github/workflows/rds-menu-step2.yml
          git commit -m "bot: enable numeric customer menu"
          git push
