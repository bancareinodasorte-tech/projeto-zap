name: Fix syntax
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i "s/total=Number(quantity\*Number(order.unit_price||3)).toFixed(2));/total=Number((quantity*Number(order.unit_price||3)).toFixed(2));/" server.js
          node --check server.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: correct stage3 total calculation'
          git push
