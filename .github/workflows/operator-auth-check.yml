name: Operator Auth Check
on:
  push:
    branches: [operator-auth-foundation-2]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate operator runtime
        run: |
          cp server.js /tmp/rds-server.js
          cp runtime-rds-operator-auth-v1.mjs /tmp/runtime-rds-operator-auth-v1.mjs
          cp runtime-rds-operator-pages-v1.mjs /tmp/runtime-rds-operator-pages-v1.mjs
          cd /tmp
          node -e "require('fs').copyFileSync('rds-server.js','server.js'); import('./runtime-rds-operator-auth-v1.mjs').then(()=>import('./runtime-rds-operator-pages-v1.mjs')).then(()=>{require('fs').copyFileSync('server.js','/tmp/generated-server.js')}).catch(e=>{console.error(e);process.exit(1)})"
          node --check /tmp/generated-server.js
      - name: Validate frontend scripts
        run: |
          node --check ui-rds-operator-v1.js
          node --check ui-rds-admin-vendedores-v1.js