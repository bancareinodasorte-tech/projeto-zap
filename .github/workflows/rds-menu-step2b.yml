name: rds-menu-step2b
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'bot:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server
        run: |
          perl -0pi -e 's{function routerMessage\(settings\)\{.*?\n\}}{function routerMessage(settings){ return `🍀 *CANAL DE VENDAS RDS*\\n\\n1️⃣ *Comprar bilhetes*\\n2️⃣ *Consultar meu pedido*\\n3️⃣ *Falar com atendente*\\n4️⃣ *Ver este menu novamente*\\n\\nDigite apenas o número da opção.`; }}s' server.js
          perl -0pi -e 's{(  let order = identity\.phone \? await activeOrder\(identity\.phone\) : null;)}{$1\n  const menuText=cleanText(text); if(["0","4","MENU","INICIO","OI","OLA"].includes(menuText)) return replyInbound(identity,routerMessage(settings)); if(menuText==="1") return beginOrder(identity,null); if(menuText==="3"){ const office=normalizeBR(settings.office_whatsapp || OFFICE_WA_DEFAULT); return replyInbound(identity,"🏢 *ATENDIMENTO*\\n"+(office||"ATENDIMENTO")); } if(menuText==="2"){ if(!order) return replyInbound(identity,"🔎 *CONSULTAR PEDIDO*\\n\\nEnvie o código do pedido."); return replyInbound(identity,"🔎 *STATUS DO PEDIDO*\\n\\nPedido: *"+order.code+"*\\nStatus: *"+order.status+"*"); }}s' server.js
      - name: Validate
        run: node --check server.js
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git rm .github/workflows/rds-menu-step2.yml .github/workflows/rds-menu-step2b.yml
          git commit -m "bot: enable numeric customer menu"
          git push
