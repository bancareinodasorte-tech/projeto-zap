name: rds-menu-migration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ !startsWith(github.event.head_commit.message, 'bot:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server
        env:
          PATCH_B64: ""
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Validate server syntax
        run: node --check server.js
      - name: Commit server and remove migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git rm .github/workflows/rds-menu-migration.yml
          git commit -m "bot: finalize customer menu routing"
          git push
