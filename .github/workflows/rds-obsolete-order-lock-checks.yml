name: RDS obsolete order lock removal checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'runtime-rds-official-ticket-chromium-v1.mjs'
      - '.github/workflows/rds-obsolete-order-lock-checks.yml'
  push:
    branches: [fix/remove-obsolete-order-id-lock]
    paths:
      - 'runtime-rds-official-ticket-chromium-v1.mjs'
      - '.github/workflows/rds-obsolete-order-lock-checks.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check installer syntax
        run: node --check runtime-rds-official-ticket-chromium-v1.mjs
      - name: Verify old code-specific lock is gone and general protections remain
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('runtime-rds-official-ticket-chromium-v1.mjs', 'utf8');
          if (source.includes('RDS-559D8F')) throw new Error('Obsolete order-code lock remains');
          for (const guard of ['RDS_OFFICIAL_PDF_PREPARATION_FAILED', 'WHATSAPP_SEND_AMBIGUOUS', 'Não foi possível preparar e arquivar o PDF oficial']) {
            if (!source.includes(guard)) throw new Error('Required general safeguard missing: ' + guard);
          }
          console.log('No fixed order-code lock; general PDF/send safeguards remain.');
          NODE
