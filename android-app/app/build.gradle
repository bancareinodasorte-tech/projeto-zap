plugins { id 'com.android.application' }

android {
    namespace 'com.reinodasorte.canalvendas'
    compileSdk 35

    defaultConfig {
        applicationId 'com.reinodasorte.canalvendas'
        minSdk 21
        targetSdk 35
        versionCode 1107
        versionName '11.4.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
