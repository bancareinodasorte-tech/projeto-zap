plugins { id 'com.android.application' }

android {
    namespace 'com.reinodasorte.canalvendas'
    compileSdk 35

    defaultConfig {
        applicationId 'com.reinodasorte.canalvendas'
        minSdk 24
        targetSdk 35
        versionCode 1100
        versionName '11.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
