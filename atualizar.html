<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atualizando Projeto Zap</title><style>body{font-family:Arial,sans-serif;background:#082f63;color:#fff;min-height:100vh;display:grid;place-items:center;margin:0}.box{max-width:520px;padding:28px;text-align:center}.spin{font-size:46px}.box h1{margin:12px 0}.box p{opacity:.9;line-height:1.5}</style></head><body><div class="box"><div class="spin">🔄</div><h1>Limpando versão antiga</h1><p>Removendo o cache da V1 e preparando a V2.1.</p><p id="status">Aguarde alguns segundos...</p></div><script>(async()=>{try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}document.getElementById('status').textContent='Limpeza concluída. Abrindo a V2.1...';setTimeout(()=>location.replace('./index.html?v=21&t='+Date.now()),1200)}catch(e){setTimeout(()=>location.replace('./index.html?v=21&t='+Date.now()),1200)}})();</script></body></html>
