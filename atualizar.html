<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atualizando Projeto Zap V3</title><body style="font-family:Arial;background:#f5f7fb;display:grid;place-items:center;min-height:100vh"><div style="background:#fff;padding:26px;border-radius:18px;max-width:440px;text-align:center"><h2>Atualizando para V3</h2><p>Limpando somente o cache técnico do aplicativo. Seus dados do Supabase não serão apagados.</p><strong id="s">Aguarde...</strong></div><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister()}if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}document.getElementById('s').textContent='Pronto. Abrindo V3...';setTimeout(()=>location.replace('./?v=31&t='+Date.now()),900)}catch(e){document.getElementById('s').textContent='Atualize esta página e tente novamente.'}})()</script></body></html>
