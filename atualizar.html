<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atualizar Projeto Zap</title></head><body style="font-family:Arial;background:#f5f7fb;display:grid;place-items:center;min-height:100vh;margin:0"><div style="background:white;border-radius:18px;padding:28px;max-width:470px;text-align:center;box-shadow:0 12px 35px rgba(0,0,0,.12)"><h2>Atualizando Projeto Zap</h2><p>Removendo somente o cache técnico. Seu login e seus dados do Supabase serão preservados.</p><strong id="status">Aguarde...</strong></div><script>(async()=>{try{if("serviceWorker" in navigator){for(const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();}if("caches" in window){for(const k of await caches.keys()) await caches.delete(k);}document.getElementById("status").textContent="Pronto. Abrindo V3.1...";setTimeout(()=>location.replace("./?build=310&t="+Date.now()),700);}catch(e){document.getElementById("status").textContent="Atualize esta página e tente novamente.";}})();</script></body></html>
